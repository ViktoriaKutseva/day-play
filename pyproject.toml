[project]
name = "day-play"
version = "0.1.0"
description = "Personal project for gamified task management and FastAPI learning - A RESTful API for daily task management built with FastAPI, SQLModel, and SQLite"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.118.2",
    "sqlmodel>=0.0.27",
    "uvicorn>=0.37.0",
    "pydantic>=2.11.7",
    "loguru>=0.7.0",
    "pydantic-settings>=2.7.0",
]

# Development dependency groups
[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "pytest-asyncio>=0.25.0",
    "pytest-mock>=3.15.0",
]
lint = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]
test = [
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "pytest-asyncio>=0.25.0",
]

# Build system (for libraries)
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Tool configuration
[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = []

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "sqlmodel.*",
    "loguru.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=src/day_play --cov-report=term-missing --cov-report=html"
asyncio_mode = "auto"
