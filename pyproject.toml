[project]
name = "day-play"
version = "0.1.0"
description = "Gamified task management web application"
readme = "README.md"
requires-python = ">=3.12"  # ✅ Per TRD Section 1.2
dependencies = [
    "fastapi>=0.115.0",
    "sqlalchemy>=2.0.0", # ✅ Per TRD Section 1.2
    "alembic>=1.12.0", # ✅ Per TRD Section 12.1
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "uvicorn>=0.37.0",
    "httpx>=0.27.0",
    "loguru>=0.7.0",
    "ruff>=0.14.3",
    "sqlmodel>=0.0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=6.0.0",
]
lint = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["uv_build>=0.8.11,<0.9.0"]  # ✅ Per project rules
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"  # ✅ Match requires-python
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.mypy]
python_version = "3.12"  # ✅ Match requires-python
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
